<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luau Sentinel | Obfuscator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500&family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>
    
    <div class="main-container">
        <header>
            <h1>LUAU<span>SENTINEL</span></h1>
            <p>Advanced Control-Flow & String Encryption</p>
        </header>

        <div class="editor-section">
            <div class="input-wrapper">
                <label>SOURCE_CODE</label>
                <textarea id="input" spellcheck="false" placeholder="-- Paste Luau script here..."></textarea>
            </div>
            
            <div class="controls">
                <button id="obfuscate-btn" onclick="runObfuscation()">
                    <span class="btn-text">RUN OBFUSCATION</span>
                    <span class="btn-glitch"></span>
                </button>
            </div>

            <div class="output-wrapper">
                <label>ENCRYPTED_OUTPUT</label>
                <textarea id="output" readonly spellcheck="false" placeholder="-- Encrypted results..."></textarea>
            </div>
        </div>

        <footer>
            <div class="status-bar">
                <span class="dot"></span> SYSTEM_READY
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/luaparse@0.3.1/luaparse.min.js"></script>
    <script src="obfuscator.js"></script>
</body>
</html>

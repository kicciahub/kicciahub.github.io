<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Luau Obfuscator v1</title>
    <style>
        body { background: #1a1a1a; color: #0f0; font-family: monospace; padding: 20px; }
        textarea { width: 100%; height: 250px; background: #000; color: #0f0; border: 1px solid #333; margin-bottom: 10px; }
        button { padding: 10px 20px; background: #0f0; color: #000; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0a0; }
    </style>
</head>
<body>
    <h1>LUA/LUAU OBFUSCATOR</h1>
    <textarea id="input" placeholder="-- Paste your Luau code here"></textarea>
    <button onclick="runObfuscation()">OBFUSCATE CODE</button>
    <textarea id="output" readonly placeholder="-- Obfuscated code will appear here"></textarea>

    <script src="https://cdn.jsdelivr.net/npm/luaparse@0.3.1/luaparse.min.js"></script>
    <script src="obfuscator.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KiciaHUB | Luau Virtualizer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;500&family=Inter:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-glow"></div>
    <div class="main-container">
        <header>
            <h1>KiciaHUB<span>PRO</span></h1>
            <p>Byte-Level Virtualization & Single-Line Minification</p>
        </header>

        <div class="editor-section">
            <div class="field-box">
                <label>SOURCE_INPUT</label>
                <textarea id="input" spellcheck="false" placeholder="-- Paste Luau code here..."></textarea>
            </div>
            
            <div class="action-bar">
                <button id="obfuscate-btn" onclick="runObfuscation()">EXECUTE_ENCRYPTION</button>
                <button id="copy-btn" onclick="copyCode()">COPY_TO_BUFFER</button>
            </div>

            <div class="field-box">
                <label>VIRTUALIZED_OUTPUT</label>
                <textarea id="output" readonly spellcheck="false" placeholder="-- Encrypted results will appear here..."></textarea>
            </div>
        </div>

        <footer>
            <div id="status-msg"><span class="dot"></span> CORE_READY</div>
            <div id="copy-toast">ENCRYPTED_DATA_COPIED</div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/luaparse@0.3.1/luaparse.min.js"></script>
    <script src="obfuscator.js"></script>
</body>
</html>
